name: tests
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eventlens
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: eventlens_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EVENTLENS_TEST_POSTGRES: postgresql+psycopg://eventlens:test_only@localhost:5432/eventlens_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: pip install -e '.[dev,postgres]'
      - run: ruff check .
      - run: mypy packages/eventlens/src
      - run: pytest -q
      - run: eventlens demo
      - run: python -m build
