<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title description" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="title">EventLens — From events to decisions</title>
  <desc id="description">A minimalist AI banner featuring a sculpted eccentric crescent lens mark, EventLens wordmark, and short subtitle.</desc>
  <defs>
    <clipPath id="clip">
      <rect width="1280" height="360" rx="28"/>
    </clipPath>

    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FAFBFD"/>
      <stop offset="0.5" stop-color="#F5F8FF"/>
      <stop offset="1" stop-color="#EEF4FF"/>
    </linearGradient>

    <radialGradient id="glow" cx="640" cy="90" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4D6BFE" stop-opacity="0.12"/>
      <stop offset="0.6" stop-color="#0EA5E9" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FAFBFD" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="mark-grad" x1="-34" y1="34" x2="34" y2="-34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.5" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="word-grad" x1="635" y1="150" x2="895" y2="235" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1D4ED8"/>
      <stop offset="0.5" stop-color="#4D6BFE"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <circle cx="640" cy="90" r="420" fill="url(#glow)"/>

    <!-- Ultra-Minimalist Eccentric Lens Mark (only 2 pure geometric shapes) -->
    <g transform="translate(640, 92)">
      <path fill="url(#mark-grad)" fill-rule="evenodd"
            d="M -34 0 A 34 34 0 1 0 34 0 A 34 34 0 1 0 -34 0 Z
               M -17 -5.5 A 22.5 22.5 0 1 0 28 -5.5 A 22.5 22.5 0 1 0 -17 -5.5 Z"/>
      <circle cx="7.5" cy="-7.5" r="7" fill="#2563EB"/>
    </g>

    <!-- Crisp Minimalist Typography -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
      <text x="640" y="224" font-size="106" font-weight="700" letter-spacing="-4.5">
        <tspan fill="#0F172A">Event</tspan><tspan fill="url(#word-grad)">Lens</tspan>
      </text>
      <text x="640" y="282" fill="#64748B" font-size="28" font-weight="400" letter-spacing="-0.3">From events to decisions.</text>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="1278.5" height="358.5" rx="27.25" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>
</svg>
