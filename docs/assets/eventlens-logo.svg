<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512" role="img" aria-labelledby="logo-title logo-desc" shape-rendering="geometricPrecision">
  <title id="logo-title">EventLens Optical Lens Logo</title>
  <desc id="logo-desc">Pure-vector precision sapphire optical camera lens inside a minimalist squircle icon.</desc>
  <defs>
    <linearGradient id="tile-bg" x1="64" y1="24" x2="448" y2="488" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F8FAFF"/>
      <stop offset="1" stop-color="#EDF3FF"/>
    </linearGradient>

    <radialGradient id="tile-aura" cx="256" cy="244" r="224" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4D6BFE" stop-opacity="0.14"/>
      <stop offset="0.65" stop-color="#0EA5E9" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Pure-vector ambient shadow (zero SVG filters = zero Retina bitmap blur) -->
    <radialGradient id="vector-shadow" cx="256" cy="274" r="198" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F172A" stop-opacity="0.24"/>
      <stop offset="0.72" stop-color="#0F172A" stop-opacity="0.12"/>
      <stop offset="0.90" stop-color="#1E3A8A" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="titanium-ring" x1="96" y1="96" x2="416" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="0.32" stop-color="#1E293B"/>
      <stop offset="0.72" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#070B14"/>
    </linearGradient>

    <linearGradient id="chamfer-rim" x1="88" y1="88" x2="424" y2="424" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E2E8F0" stop-opacity="0.92"/>
      <stop offset="0.45" stop-color="#4D6BFE" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0.78"/>
    </linearGradient>

    <radialGradient id="sapphire-glass" cx="276" cy="280" r="142" fx="292" fy="296" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.26" stop-color="#4D6BFE"/>
      <stop offset="0.58" stop-color="#1D4ED8"/>
      <stop offset="0.82" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#060A15"/>
    </radialGradient>

    <radialGradient id="top-left-bloom" cx="196" cy="194" r="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.46"/>
      <stop offset="0.42" stop-color="#BAE6FD" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#4D6BFE" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ar-cyan-reflex" cx="312" cy="314" r="78" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.72"/>
      <stop offset="0.48" stop-color="#38BDF8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4D6BFE" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="inner-doublet" cx="268" cy="272" r="72" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="0.58" stop-color="#0B132B"/>
      <stop offset="1" stop-color="#050811"/>
    </radialGradient>

    <linearGradient id="glass-rim" x1="128" y1="128" x2="384" y2="384" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.68"/>
      <stop offset="0.45" stop-color="#60A5FA" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.68"/>
    </linearGradient>

    <clipPath id="glass-mask">
      <circle cx="256" cy="256" r="126"/>
    </clipPath>
  </defs>

  <!-- Minimalist Apple Squircle Icon Tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tile-bg)" stroke="#E2E8F0" stroke-width="2"/>
  <circle cx="256" cy="244" r="218" fill="url(#tile-aura)"/>

  <!-- Pure-Vector Soft Elevation Shadow -->
  <circle cx="256" cy="274" r="198" fill="url(#vector-shadow)"/>

  <!-- Precision Machined Sapphire Camera Lens -->
  <g>
    <circle cx="256" cy="256" r="176" fill="url(#titanium-ring)"/>
    <circle cx="256" cy="256" r="175" fill="none" stroke="url(#chamfer-rim)" stroke-width="2.2"/>

    <circle cx="256" cy="256" r="158" fill="#0B1120" stroke="#334155" stroke-opacity="0.55" stroke-width="1.5"/>
    <circle cx="256" cy="256" r="147" fill="none" stroke="#1E293B" stroke-width="1.2"/>
    <circle cx="256" cy="256" r="138" fill="#060913" stroke="#1E293B" stroke-opacity="0.9" stroke-width="1.5"/>

    <g clip-path="url(#glass-mask)">
      <circle cx="256" cy="256" r="126" fill="url(#sapphire-glass)"/>
      <circle cx="256" cy="256" r="126" fill="url(#top-left-bloom)"/>
      <circle cx="312" cy="314" r="78" fill="url(#ar-cyan-reflex)"/>

      <circle cx="256" cy="256" r="96" fill="none" stroke="#93C5FD" stroke-opacity="0.24" stroke-width="1.2"/>
      <circle cx="256" cy="256" r="66" fill="url(#inner-doublet)" stroke="#60A5FA" stroke-opacity="0.45" stroke-width="1.5"/>

      <circle cx="256" cy="256" r="32" fill="#04070F" stroke="#38BDF8" stroke-opacity="0.42" stroke-width="1.4"/>
      <circle cx="264" cy="264" r="11" fill="#2563EB" fill-opacity="0.48"/>

      <ellipse cx="198" cy="196" rx="22" ry="14" transform="rotate(-42 198 196)" fill="#FFFFFF" fill-opacity="0.94"/>
      <circle cx="172" cy="226" r="6.5" fill="#E0F2FE" fill-opacity="0.82"/>
      <circle cx="304" cy="304" r="8.5" fill="#67E8F9" fill-opacity="0.60"/>
      <circle cx="322" cy="286" r="3.5" fill="#BAE6FD" fill-opacity="0.52"/>
    </g>

    <circle cx="256" cy="256" r="126" fill="none" stroke="url(#glass-rim)" stroke-width="1.8"/>
  </g>
</svg>
