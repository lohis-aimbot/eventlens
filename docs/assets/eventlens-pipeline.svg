<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="244" viewBox="0 0 1280 244" role="img" aria-labelledby="pipe-title pipe-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="pipe-title">EventLens 4-Stage Architecture Pipeline</title>
  <desc id="pipe-desc">Four minimalist Apple Bento cards showing Observe, Reason, Govern, and Execute stages.</desc>
  <defs>
    <filter id="card-elev" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.045"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.03"/>
    </filter>
  </defs>

  <!-- Subtle Outer Canvas -->
  <rect x="0.75" y="0.75" width="1278.5" height="242.5" rx="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- Card 01: Observe -->
    <g transform="translate(28, 26)" filter="url(#card-elev)">
      <rect width="282" height="192" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
      <rect x="24" y="24" width="36" height="36" rx="10" fill="#EFF6FF"/>
      <circle cx="42" cy="42" r="5" fill="#2563EB"/>
      <circle cx="42" cy="42" r="10.5" fill="none" stroke="#2563EB" stroke-opacity="0.45" stroke-width="1.6"/>
      <text x="234" y="47" fill="#94A3B8" font-size="12" font-weight="600" letter-spacing="0.8">01</text>
      <text x="24" y="94" fill="#0F172A" font-size="18" font-weight="600" letter-spacing="-0.3">Observe</text>
      <text x="24" y="122" fill="#475569" font-size="13.5" font-weight="400">Tier-1 English wires, central</text>
      <text x="24" y="142" fill="#475569" font-size="13.5" font-weight="400">bank releases &amp; live EUR/USD</text>
      <text x="24" y="162" fill="#475569" font-size="13.5" font-weight="400">cTrader Open API ticks.</text>
    </g>

    <!-- Connector 1 -> 2 -->
    <g stroke="#CBD5E1" stroke-width="1.75" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="316" y1="122" x2="334" y2="122"/>
      <path d="M 330 117.5 L 335 122 L 330 126.5"/>
    </g>

    <!-- Card 02: Reason -->
    <g transform="translate(342, 26)" filter="url(#card-elev)">
      <rect width="282" height="192" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
      <rect x="24" y="24" width="36" height="36" rx="10" fill="#EEF2FF"/>
      <circle cx="42" cy="42" r="9.5" fill="none" stroke="#4D6BFE" stroke-width="1.8"/>
      <circle cx="42" cy="42" r="3.5" fill="#4D6BFE"/>
      <text x="234" y="47" fill="#94A3B8" font-size="12" font-weight="600" letter-spacing="0.8">02</text>
      <text x="24" y="94" fill="#0F172A" font-size="18" font-weight="600" letter-spacing="-0.3">Reason</text>
      <text x="24" y="122" fill="#475569" font-size="13.5" font-weight="400">Single-pass DeepSeek JSON</text>
      <text x="24" y="142" fill="#475569" font-size="13.5" font-weight="400">proposals backed by durable</text>
      <text x="24" y="162" fill="#475569" font-size="13.5" font-weight="400">SQLite thesis memory.</text>
    </g>

    <!-- Connector 2 -> 3 -->
    <g stroke="#CBD5E1" stroke-width="1.75" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="630" y1="122" x2="648" y2="122"/>
      <path d="M 644 117.5 L 649 122 L 644 126.5"/>
    </g>

    <!-- Card 03: Govern -->
    <g transform="translate(656, 26)" filter="url(#card-elev)">
      <rect width="282" height="192" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
      <rect x="24" y="24" width="36" height="36" rx="10" fill="#F0FDFA"/>
      <path d="M 42 32 L 50 35.5 V 42.5 C 50 47.5 46.5 51 42 52.5 C 37.5 51 34 47.5 34 42.5 V 35.5 Z" fill="none" stroke="#0D9488" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M 38.8 42.2 L 41.2 44.6 L 45.5 40" fill="none" stroke="#0D9488" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="234" y="47" fill="#94A3B8" font-size="12" font-weight="600" letter-spacing="0.8">03</text>
      <text x="24" y="94" fill="#0F172A" font-size="18" font-weight="600" letter-spacing="-0.3">Govern</text>
      <text x="24" y="122" fill="#475569" font-size="13.5" font-weight="400">Deterministic hard risk, stale</text>
      <text x="24" y="142" fill="#475569" font-size="13.5" font-weight="400">quote gates, daily LLM caps &amp;</text>
      <text x="24" y="162" fill="#475569" font-size="13.5" font-weight="400">independent pip SL/TP exits.</text>
    </g>

    <!-- Connector 3 -> 4 -->
    <g stroke="#CBD5E1" stroke-width="1.75" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="944" y1="122" x2="962" y2="122"/>
      <path d="M 958 117.5 L 963 122 L 958 126.5"/>
    </g>

    <!-- Card 04: Execute -->
    <g transform="translate(970, 26)" filter="url(#card-elev)">
      <rect width="282" height="192" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
      <rect x="24" y="24" width="36" height="36" rx="10" fill="#F1F5F9"/>
      <rect x="35" y="40" width="14" height="11" rx="2.5" fill="none" stroke="#0F172A" stroke-width="1.7"/>
      <path d="M 38 40 V 36.5 A 4 4 0 0 1 46 36.5 V 40" fill="none" stroke="#0F172A" stroke-width="1.7" stroke-linecap="round"/>
      <text x="234" y="47" fill="#94A3B8" font-size="12" font-weight="600" letter-spacing="0.8">04</text>
      <text x="24" y="94" fill="#0F172A" font-size="18" font-weight="600" letter-spacing="-0.3">Execute</text>
      <text x="24" y="122" fill="#475569" font-size="13.5" font-weight="400">Local Shadow ledger &amp; optional</text>
      <text x="24" y="142" fill="#475569" font-size="13.5" font-weight="400">double-locked Pepperstone</text>
      <text x="24" y="162" fill="#475569" font-size="13.5" font-weight="400">cTrader Demo mirroring.</text>
    </g>
  </g>
</svg>
