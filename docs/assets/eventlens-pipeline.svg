<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="pipeline-title pipeline-desc">
  <title id="pipeline-title">EventLens research workflow</title>
  <desc id="pipeline-desc">Observe events and quotes, reason with persistent thesis memory, govern target positions with deterministic risk, and record simulated Shadow fills. Follow stages one through four in row order. Broker execution is blocked.</desc>
  <rect x="1" y="1" width="958" height="438" rx="24" fill="#F8FAFC" stroke="#CBD5E1"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <g transform="translate(28 28)">
      <rect width="438" height="178" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="26" y="42" fill="#2563EB" font-size="22" font-weight="700">01 / OBSERVE</text>
      <text x="26" y="91" fill="#0F172A" font-size="32" font-weight="600">Events + quotes</text>
      <text x="26" y="135" fill="#334155" font-size="24">Preserve when data arrived</text>
    </g>
    <g transform="translate(494 28)">
      <rect width="438" height="178" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="26" y="42" fill="#4F46E5" font-size="22" font-weight="700">02 / REASON</text>
      <text x="26" y="91" fill="#0F172A" font-size="32" font-weight="600">LLM + thesis memory</text>
      <text x="26" y="135" fill="#334155" font-size="24">Propose a target position</text>
    </g>
    <g transform="translate(28 234)">
      <rect width="438" height="178" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="26" y="42" fill="#0F766E" font-size="22" font-weight="700">03 / GOVERN</text>
      <text x="26" y="91" fill="#0F172A" font-size="32" font-weight="600">Hard risk rules</text>
      <text x="26" y="135" fill="#334155" font-size="24">Validate, limit, protect</text>
    </g>
    <g transform="translate(494 234)">
      <rect width="438" height="178" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="26" y="42" fill="#475569" font-size="22" font-weight="700">04 / RECORD</text>
      <text x="26" y="91" fill="#0F172A" font-size="32" font-weight="600">Shadow ledger</text>
      <text x="26" y="135" fill="#334155" font-size="24">Simulate fills and costs</text>
    </g>
  </g>
</svg>
