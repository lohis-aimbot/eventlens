<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title description">
  <title id="title">EventLens — From events to decisions</title>
  <desc id="description">A minimal light-gray banner with a blue lens mark, centered black EventLens wordmark, and the subtitle From events to decisions.</desc>
  <defs>
    <radialGradient id="halo">
      <stop stop-color="#dceaff" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#f5f5f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lens" x1="618" y1="77" x2="662" y2="123" gradientUnits="userSpaceOnUse">
      <stop stop-color="#87c5ff"/>
      <stop offset="0.5" stop-color="#0071e3"/>
      <stop offset="1" stop-color="#283c99"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.35" cy="0.3" r="0.8">
      <stop stop-color="#8cddff"/>
      <stop offset="0.55" stop-color="#1268c9"/>
      <stop offset="1" stop-color="#17396f"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="440" rx="24" fill="#f5f5f7"/>
  <ellipse cx="640" cy="104" rx="112" ry="76" fill="url(#halo)"/>
  <g>
    <circle cx="640" cy="100" r="31" fill="#ffffff" stroke="#d9dce3" stroke-width="1.5"/>
    <circle cx="640" cy="100" r="24" fill="url(#lens)"/>
    <circle cx="640" cy="100" r="16" fill="url(#glass)" stroke="#b5dcff" stroke-opacity="0.65" stroke-width="1.2"/>
    <circle cx="640" cy="100" r="7" fill="#102a50"/>
    <circle cx="632" cy="92" r="4.5" fill="#ffffff" fill-opacity="0.85"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="640" y="239" fill="#1d1d1f" font-size="104" font-weight="600" letter-spacing="-4.5">EventLens</text>
    <text x="640" y="297" fill="#424245" font-size="32" font-weight="400" letter-spacing="-0.5">From events to decisions.</text>
    <text x="640" y="359" fill="#6e6e73" font-size="20" font-weight="400">LLM-driven intraday research.</text>
  </g>
</svg>
