<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title description">
  <title id="title">EventLens — From events to decisions</title>
  <desc id="description">A dark blue EventLens banner with a lens symbol and connected Event, Thesis and Decision nodes. LLM-driven intraday research, with risk outside the model.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1220"/>
      <stop offset="0.62" stop-color="#102137"/>
      <stop offset="1" stop-color="#12373d"/>
    </linearGradient>
    <linearGradient id="signal" x1="825" y1="180" x2="1178" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2dd4bf" stop-opacity="0.15"/>
      <stop offset="0.55" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#d6e7f5" stroke-opacity="0.045"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="20" fill="url(#background)"/>
  <rect width="1280" height="360" rx="20" fill="url(#grid)"/>
  <path d="M56 1H1224" stroke="#5eead4" stroke-opacity="0.25"/>

  <g transform="translate(62 58)" fill="none" stroke="#5eead4" stroke-width="2.5">
    <circle cx="24" cy="24" r="22"/>
    <circle cx="24" cy="24" r="13" stroke-opacity="0.45"/>
    <path d="M9 25h9l5-9 6 16 5-7h7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m40 40 10 10" stroke-linecap="round"/>
  </g>
  <text x="130" y="88" fill="#9fb6cb" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2.3">EVENT-DRIVEN INTELLIGENCE</text>
  <text x="60" y="187" fill="#f1f6fc" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="700" letter-spacing="-3">EventLens<tspan fill="#5eead4">.</tspan></text>
  <text x="64" y="239" fill="#d1dfed" font-family="Arial, Helvetica, sans-serif" font-size="29">From events to decisions.</text>
  <text x="64" y="302" fill="#8fa9bf" font-family="Arial, Helvetica, sans-serif" font-size="16">LLM-driven intraday research</text>
  <circle cx="310" cy="296" r="2" fill="#5eead4"/>
  <text x="326" y="302" fill="#8fa9bf" font-family="Arial, Helvetica, sans-serif" font-size="16">Risk outside the model</text>

  <g fill="none" stroke="#5eead4">
    <circle cx="1008" cy="174" r="134" stroke-opacity="0.08"/>
    <circle cx="1008" cy="174" r="104" stroke-opacity="0.13"/>
    <circle cx="1008" cy="174" r="73" stroke-opacity="0.12" stroke-dasharray="3 9"/>
  </g>
  <path d="M804 178h52l17-22 19 45 18-23h294" fill="none" stroke="url(#signal)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="824" y="123" width="94" height="44" rx="10" fill="#102b38" stroke="#2dd4bf" stroke-opacity="0.5"/>
    <text x="871" y="150" fill="#99f6e4" font-size="13" font-weight="700" letter-spacing="1.1">EVENT</text>
    <rect x="956" y="123" width="104" height="44" rx="10" fill="#102b38" stroke="#2dd4bf" stroke-opacity="0.5"/>
    <text x="1008" y="150" fill="#99f6e4" font-size="13" font-weight="700" letter-spacing="1.1">THESIS</text>
    <rect x="1098" y="123" width="118" height="44" rx="10" fill="#152c43" stroke="#93c5fd" stroke-opacity="0.5"/>
    <text x="1157" y="150" fill="#bfdbfe" font-size="13" font-weight="700" letter-spacing="1.1">DECISION</text>
    <circle cx="871" cy="178" r="4" fill="#5eead4"/>
    <circle cx="1008" cy="178" r="4" fill="#5eead4"/>
    <circle cx="1157" cy="178" r="4" fill="#93c5fd"/>
    <text x="1008" y="231" fill="#8fa9bf" font-size="14" letter-spacing="0.5">Evidence. Context. Control.</text>
  </g>
  <rect x="1000" y="282" width="216" height="30" rx="15" fill="#132e38" stroke="#5eead4" stroke-opacity="0.18"/>
  <circle cx="1018" cy="297" r="3" fill="#fbbf24"/>
  <text x="1030" y="302" fill="#d6e5ee" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1">RESEARCH FOUNDATION</text>
</svg>
